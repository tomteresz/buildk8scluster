name: Bootstrap_backend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_STATE_BUCKET: eks-gpu-state
  TF_LOCK_TABLE: eks-gpu-dev-lock

jobs:
  bootstrap:
    runs-on: ubuntu-24.04

    steps:
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::651629222199:role/github-access-role
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================
      # S3 backend bucket
      # ==========================================

      - name: Create Terraform state bucket
        shell: bash
        run: |
          if aws s3api head-bucket \
            --bucket "$TF_STATE_BUCKET" 2>/dev/null; then

            echo "Bucket $TF_STATE_BUCKET already exists"

          else

            echo "Creating bucket $TF_STATE_BUCKET"

            aws s3api create-bucket \
              --bucket "$TF_STATE_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"

          fi

      - name: Enable bucket versioning
        run: |
          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled

      - name: Enable bucket encryption
        run: |
          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'

      - name: Block public access
        run: |
          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Tag Terraform state bucket
        run: |
          aws s3api put-bucket-tagging \
            --bucket "$TF_STATE_BUCKET" \
            --tagging '{
              "TagSet": [
                {
                  "Key": "Name",
                  "Value": "eks-gpu-dev-state"
                },
                {
                  "Key": "Environment",
                  "Value": "Shared"
                },
                {
                  "Key": "Purpose",
                  "Value": "Terraform Remote Backend"
                }
              ]
            }'

      # ==========================================
      # DynamoDB state locking
      # ==========================================

      - name: Create DynamoDB lock table
        shell: bash
        run: |
          if aws dynamodb describe-table \
            --table-name "$TF_LOCK_TABLE" \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "DynamoDB table $TF_LOCK_TABLE already exists"

          else

            echo "Creating DynamoDB table $TF_LOCK_TABLE"

            aws dynamodb create-table \
              --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions \
                AttributeName=LockID,AttributeType=S \
              --key-schema \
                AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION" \
              --tags \
                Key=Name,Value="Terraform State Lock Table" \
                Key=Environment,Value=Shared \
                Key=Purpose,Value="Terraform State Locking"

            aws dynamodb wait table-exists \
              --table-name "$TF_LOCK_TABLE" \
              --region "$AWS_REGION"

          fi
