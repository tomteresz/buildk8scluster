apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi-test
  namespace: test
spec:
  restartPolicy: Never
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
  containers:
  - name: nvidia-smi
    image: nvidia/cuda:12.4.0-base-ubuntu22.04
    args: ["nvidia-smi"]
    resources:
      requests:
        memory: "512Mi"
        cpu: "1"
      limits:
        nvidia.com/gpu: 1
        memory: "512Mi"
        cpu: "1"
