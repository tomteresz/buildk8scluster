apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-ui-deploy
  namespace: vllm-ui
  labels:
    app: nextjs-vllm-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-vllm-ui
  template:
    metadata:
      labels:
        app: nextjs-vllm-ui
    spec:
      nodeSelector:
        workload-type: apps
      tolerations:
        - key: "workload-type"
          operator: "Equal"
          value: "apps"
          effect: "NoSchedule"
      containers:
      - name: ui
        image: ghcr.io/yoziru/nextjs-vllm-ui@sha256:946e534d58f9b1ad081ec0ed51711f634cdfc7e900be8999329e1f3cc6c72839
        ports:
        - containerPort: 3000
        env:
        # Update with your actual vLLM Service name and port
        - name: VLLM_URL
          value: "http://vllm-svc.vllm.svc.cluster.local:8000"
        - name: VLLM_MODEL
          value: "Qwen/Qwen2.5-0.5B-Instruct"
        # - name: VLLM_API_KEY
        #   value: "ignored"
        - name: VLLM_TOKEN_LIMIT
          #value: "4096"
          value: "8192"
        startupProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi