apiVersion: v1
kind: Service
metadata:
  name: external-dns-test
  annotations:
    external-dns.kubernetes.io/hostname: test.twojadomena.pl
spec:
  type: LoadBalancer
  selector:
    app: external-dns-test
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns-test
  template:
    metadata:
      labels:
        app: external-dns-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80